---
- name: Ensure Debian based hosts are patched
  hosts: all
  serial: 1
  tasks:
    - name: Allow repository release info changes
      ansible.builtin.copy:
        content: 'Acquire::AllowReleaseInfoChange "true";'
        dest: /etc/apt/apt.conf.d/99allow-release-change
        mode: '0644'
      become: true
      when: (ansible_facts.os_family == 'Debian')

    - name: Ensures local repo cache is clear
      ansible.builtin.apt:
        autoclean: true
      become: true
      when: (ansible_facts.os_family == 'Debian')

    - name: Ensure unused dependencies are removed
      ansible.builtin.apt:
        autoremove: true
      become: true
      when: (ansible_facts.os_family == 'Debian')

    - name: Ensures repo cache is up to date
      ansible.builtin.apt:
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive
      become: true
      when: (ansible_facts.os_family == 'Debian')

    - name: Ensures os is up to date
      ansible.builtin.apt:
        upgrade: true
      environment:
        DEBIAN_FRONTEND: noninteractive
      become: true
      when: (ansible_facts.os_family == 'Debian')

    - name: Check if a reboot is needed
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: file_check
      become: true
      when: (ansible_facts.os_family == 'Debian')
      changed_when: file_check.stat.exists

    - name: Reboot System
      block:
        - name: Drain node before a reboot
          kubernetes.core.k8s_drain:
            state: drain
            name: "{{ ansible_facts.nodename | lower }}"
            delete_options:
              delete_emptydir_data: true
              ignore_daemonsets: true
              terminate_grace_period: 900
          delegate_to: "{{ k8s_control_node }}"
          when: groups['kubernetes'] is defined

        - name: Ensure Server is rebooted
          ansible.builtin.reboot:
            reboot_timeout: 3600
          become: true
          become_method: sudo
      rescue:
        - name: Uncordon node
          kubernetes.core.k8s_drain:
            state: uncordon
            name: "{{ ansible_facts.nodename | lower }}"
          delegate_to: "{{ k8s_control_node }}"
          when: groups['kubernetes'] is defined
      always:
        - name: Wait for system connection
          ansible.builtin.wait_for_connection:
            delay: 70

        - name: Uncordon node after rebooot
          kubernetes.core.k8s_drain:
            state: uncordon
            name: "{{ ansible_facts.nodename | lower }}"
          delegate_to: "{{ k8s_control_node }}"
          when: groups['kubernetes'] is defined

        - name: Wait for pods to start again
          ansible.builtin.wait_for_connection:
            delay: 60
          when: groups['kubernetes'] is defined
      when: file_check.changed
